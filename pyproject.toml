[project]
name = "healthflow-python"
version = "0.1.0"
description = "HealthFlow Medical Assistant - Python Version"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "milvus-lite>=2.4.0",
    "neo4j>=5.18.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.20",
    "vllm>=0.3.0",
    "sentence-transformers>=2.3.0",
    "pdfplumber>=0.10.3",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "openai>=1.10.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "transformers>=4.37.0",
    "peft>=0.8.0",
    "bitsandbytes>=0.41.0",
    "trl>=0.7.0",
    "accelerate>=0.25.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
