<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">HealthFlow medical assistant</title>
  <desc id="desc">A visual identity banner for HealthFlow, a coordinate-aware medical document assistant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="0.52" stop-color="#102d55"/>
      <stop offset="1" stop-color="#124e5f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#63e6be"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="-10" r="230" fill="#63e6be" opacity="0.08"/>
  <circle cx="1140" cy="310" r="250" fill="#6ea8fe" opacity="0.08"/>
  <path d="M0 304 C190 248 270 340 460 286 S760 218 1200 282" fill="none" stroke="#8be9fd" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M0 326 C190 270 270 362 460 308 S760 240 1200 304" fill="none" stroke="#63e6be" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(72 72)">
    <rect width="88" height="88" rx="24" fill="#0b213f" stroke="#63e6be" stroke-opacity="0.8" stroke-width="2" filter="url(#shadow)"/>
    <path d="M44 18v52M18 44h52" stroke="url(#glow)" stroke-linecap="round" stroke-width="10"/>
    <circle cx="44" cy="44" r="32" fill="none" stroke="#d7f9f1" stroke-opacity="0.65" stroke-width="2"/>
  </g>

  <text x="196" y="122" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">HealthFlow</text>
  <text x="201" y="168" fill="#b7d9e6" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="1.2">COORDINATE-AWARE MEDICAL AI ASSISTANT</text>
  <text x="76" y="250" fill="#e2f7f4" font-family="Segoe UI, Arial, sans-serif" font-size="22">Document understanding  ·  GraphRAG  ·  Specialist Agents  ·  Safety Guardrails</text>
  <g transform="translate(78 286)">
    <rect width="170" height="34" rx="17" fill="#63e6be" fill-opacity="0.16" stroke="#63e6be" stroke-opacity="0.55"/>
    <text x="85" y="23" text-anchor="middle" fill="#b8f5e5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">LANGGRAPH PIPELINE</text>
  </g>
  <g transform="translate(262 286)">
    <rect width="148" height="34" rx="17" fill="#6ea8fe" fill-opacity="0.16" stroke="#6ea8fe" stroke-opacity="0.55"/>
    <text x="74" y="23" text-anchor="middle" fill="#c9dcff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">PYTHON MAINLINE</text>
  </g>
</svg>
